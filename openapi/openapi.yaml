# Single source of truth for the API contract.
#   - backend/  generates Spring interfaces + models from this file (openapi-generator-maven-plugin, generator "spring")
#   - frontend/ generates a TypeScript fetch client + models from this file (openapi-generator-cli, generator "typescript-fetch")
# Change the contract here first, then regenerate both sides.

openapi: 3.0.3

info:
  title: User Service API
  version: 1.0.0

tags:
  - name: Users
    description: User operations
  - name: Session
    description: The signed-in user

# Windows SSO: the browser authenticates with "Authorization: Negotiate <token>" (Kerberos via SPNEGO),
# handled by Waffle or Spring Security Kerberos depending on the backend profile. The browser does this
# automatically, so generated clients don't send credentials themselves.
security:
  - negotiate: []

paths:
  /me:
    get:
      tags:
        - Session
      operationId: getCurrentUser
      summary: The authenticated Windows user and their application roles
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated (response carries WWW-Authenticate Negotiate)

  /users:
    get:
      tags:
        - Users
      operationId: getUsersByName
      summary: Get users by name
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Users matching the name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserDTO"
        "400":
          description: Invalid name supplied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated

components:
  securitySchemes:
    negotiate:
      type: http
      scheme: negotiate

  schemas:
    UserDTO:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    CurrentUser:
      type: object
      required:
        - username
        - roles
      properties:
        username:
          type: string
          description: Account name, e.g. DOMAIN\jdoe (Waffle) or jdoe@DOMAIN.COM (Kerberos)
        roles:
          type: array
          description: Application roles, e.g. ROLE_USER, ROLE_ADMIN
          items:
            type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer

    # Payload broadcast over STOMP on /topic/my_events.
    # Not referenced by any path, but kept in the contract so both sides share the type.
    WebSocketEvent:
      type: object
      required:
        - status
      properties:
        status:
          type: boolean
