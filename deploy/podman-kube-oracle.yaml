# Oracle stack: database, backend (Spring) and frontend (nginx + React), each in its own pod
# with its own CPU/memory requests and limits so they can be sized independently.
#
#   podman network create app-net                      # once; gives pod-name DNS between pods
#   podman build -f backend/Dockerfile  -t your_repo_name-backend:latest  .
#   podman build -f frontend/Dockerfile -t your_repo_name-frontend:latest .
#   podman play kube --network app-net deploy/podman-kube-oracle.yaml
#   podman play kube --down deploy/podman-kube-oracle.yaml             # tear down
#
# Frontend: http://localhost:3000   Backend (direct, swagger-ui): http://localhost:8080/swagger-ui.html
# Monitoring (Prometheus/Grafana): see monitoring/README.md

apiVersion: v1
kind: Pod
metadata:
  name: oracle-pod
spec:
  containers:
    - name: oracle
      # Oracle Database 23ai Free. APP_USER is created in the FREEPDB1 pluggable database on first start.
      image: docker.io/gvenzl/oracle-free:23-slim
      ports:
        - containerPort: 1521
          hostPort: 1521
      env:
        - name: ORACLE_PASSWORD        # SYS/SYSTEM password - demo only
          value: OraclePassw0rd
        - name: APP_USER
          value: appuser
        - name: APP_USER_PASSWORD
          value: AppPassw0rd!
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 3Gi
      volumeMounts:
        - name: oracle-data
          mountPath: /opt/oracle/oradata
  volumes:
    - name: oracle-data
      persistentVolumeClaim:
        claimName: oracle-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oracle-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: spring-app-pod
  labels:
    app: your_repo_name-backend
spec:
  containers:
    - name: spring-app
      image: your_repo_name-backend:latest
      ports:
        - containerPort: 8080
          hostPort: 8080
        - containerPort: 8081        # actuator: probes + /actuator/prometheus (scraped over app-net, not published)
      env:
        - name: SPRING_PROFILES_ACTIVE
          value: oracle,kerberos   # Waffle needs a Windows host - see README "Windows SSO"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:oracle:thin:@//oracle-pod:1521/FREEPDB1
        - name: SPRING_DATASOURCE_USERNAME
          value: appuser
        - name: SPRING_DATASOURCE_PASSWORD
          value: AppPassw0rd!         # demo only - use podman secrets / your vault
        - name: SPRINGDOC_ENABLE_DATA_REST
          value: "false"
        - name: APP_ENVIRONMENT
          value: local
        # Kerberos: SPN = host name the browser uses for the app (the frontend)
        - name: KERBEROS_SERVICE_PRINCIPAL
          value: HTTP/app.mydomain.com@MYDOMAIN.COM
        - name: KERBEROS_KEYTAB
          value: /etc/krb5/app.keytab
        - name: JAVA_TOOL_OPTIONS
          value: -Djava.security.krb5.conf=/etc/krb5/krb5.conf
        - name: APP_WEBSOCKET_ALLOWEDORIGINPATTERNS_0
          value: http://localhost:3000
      volumeMounts:
        - name: krb5
          mountPath: /etc/krb5
          readOnly: true
      readinessProbe:
        httpGet:
          path: /actuator/health/readiness
          port: 8081
        initialDelaySeconds: 20
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /actuator/health/liveness
          port: 8081
        initialDelaySeconds: 60
        periodSeconds: 20
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 1Gi
  volumes:
    # app.keytab + krb5.conf from your AD admin. Absolute host path - adjust.
    - name: krb5
      hostPath:
        path: /opt/your_repo_name/krb5
        type: Directory

---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  labels:
    app: your_repo_name-frontend
spec:
  containers:
    - name: frontend
      image: your_repo_name-frontend:latest
      ports:
        - containerPort: 8080
          hostPort: 3000
      env:
        # nginx proxies /api and /websockets here (pod name resolves on app-net)
        - name: BACKEND_URL
          value: http://spring-app-pod:8080
      # Static files + reverse proxy: needs far less than the JVM
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
    # Prometheus metrics for nginx, read from stub_status on :8081 inside this pod
    - name: nginx-exporter
      image: docker.io/nginx/nginx-prometheus-exporter:1.4
      args:
        - --nginx.scrape-uri=http://localhost:8081/stub_status
      ports:
        - containerPort: 9113
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
