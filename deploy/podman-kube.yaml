# Local multi-service setup: postgres, backend (Spring) and frontend (nginx + React) each run in
# their own pod with their own CPU/memory requests and limits, so they can be sized independently.
#
#   podman build -f backend/Dockerfile  -t your_repo_name-backend:latest  .
#   podman build -f frontend/Dockerfile -t your_repo_name-frontend:latest .
#   podman play kube deploy/podman-kube.yaml          # tear down: podman play kube --down deploy/podman-kube.yaml
#
# Frontend: http://localhost:3000   Backend (direct, swagger-ui): http://localhost:8080/swagger-ui.html

apiVersion: v1
kind: Pod
metadata:
  name: postgres-pod
spec:
  containers:
    - name: postgres
      image: postgres:17
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_DB
          value: appdb
        - name: POSTGRES_USER
          value: appuser
        - name: POSTGRES_PASSWORD
          value: apppassword
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: postgres-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: spring-app-pod
spec:
  containers:
    - name: spring-app
      image: your_repo_name-backend:latest
      ports:
        - containerPort: 8080
          hostPort: 8080
      env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres-pod:5432/appdb
        - name: SPRING_DATASOURCE_USERNAME
          value: appuser
        - name: SPRING_DATASOURCE_PASSWORD
          value: apppassword
        - name: SPRINGDOC_ENABLE_DATA_REST
          value: "false"
        # Trusted token issuer. Must be the exact "iss" in the tokens AND reachable from inside this pod
        # (localhost here is the pod itself) - use a hostname both the browser and the pod can resolve.
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURIS_0
          value: http://<your-keycloak-host>:8180/realms/your-realm
        - name: APP_WEBSOCKET_ALLOWEDORIGINPATTERNS_0
          value: http://localhost:3000
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
spec:
  containers:
    - name: frontend
      image: your_repo_name-frontend:latest
      ports:
        - containerPort: 8080
          hostPort: 3000
      env:
        # nginx proxies /api and /websockets here (pod name resolves on the podman network)
        - name: BACKEND_URL
          value: http://spring-app-pod:8080
        # As seen by the browser
        - name: OIDC_AUTHORITY
          value: http://<your-keycloak-host>:8180/realms/your-realm
        - name: OIDC_CLIENT_ID
          value: your_repo_name-frontend
      # Static files + reverse proxy: needs far less than the JVM
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
