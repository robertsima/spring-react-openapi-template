# Oracle Database (19c+ / 23ai Free). Driver: com.oracle.database.jdbc:ojdbc11
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:appuser}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
  # Hibernate picks the dialect from the JDBC metadata; set spring.jpa.database-platform only to override it.
