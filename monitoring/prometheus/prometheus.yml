# Prometheus scrape config (placeholder - adjust targets per environment).
# Locally the pods are on the "app-net" podman network, so they resolve by pod name.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Spring Boot backend - Micrometer via actuator on the management port (not exposed through nginx)
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["spring-app-pod:8081"]
        labels:
          service: your_repo_name-backend

  # Frontend nginx - nginx-prometheus-exporter sidecar in frontend-pod
  - job_name: frontend-nginx
    static_configs:
      - targets: ["frontend-pod:9113"]
        labels:
          service: your_repo_name-frontend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
